<mat-toolbar class="mat-elevation-z6" color="primary" role="heading">
    <a fxLayoutAlign="center" routerLink="/"><img src="/assets/logo/icon.png" title="Welcome to Venzra" /></a>
    <span fxFlex></span>
    <venzra-admin-account></venzra-admin-account>
</mat-toolbar>

<div fxLayout="row" fxFlex>
    <mat-sidenav-container>
        <mat-sidenav class="mat-elevation-z4" mode="side" opened="true">
            <mat-nav-list dense>
                <h3 matSubheader><mat-icon>apps</mat-icon> Products</h3>
                <a mat-list-item routerLink="/products" routerLinkActive="active">All products</a>

                <mat-divider></mat-divider>

                <h3 matSubheader><mat-icon>cloud_done</mat-icon> Orders</h3>
                <a mat-list-item routerLink="/orders" routerLinkActive="active">All Orders</a>

                <mat-divider></mat-divider>

                <h3 matSubheader><mat-icon>store</mat-icon> Store setup</h3>
                <a mat-list-item routerLink="/account/store" routerLinkActive="active">Branding</a>
                <a mat-list-item routerLink="/shipping" routerLinkActive="active">Shipping</a>

                <mat-divider></mat-divider>

                <h3 matSubheader><mat-icon>account_box</mat-icon> Account</h3>
                <a mat-list-item routerLink="/account/payments" routerLinkActive="active">Payments and subscription</a>
                <a mat-list-item routerLink="/auth/logout">Logout</a>
            </mat-nav-list>
        </mat-sidenav>

        <div fxLayout="column" class="private-container">
            <div fxFlex="grow" class="private-content">
                <div>
                    <router-outlet></router-outlet>
                </div>
            </div>
            <mat-toolbar color="primary" role="note">
                <span fxFlex></span>
                <button mat-button href="javascript:void(0)" (click)="viewServiceAgreement()">Agreement terms</button>
            </mat-toolbar>
        </div>
    </mat-sidenav-container>
</div>
