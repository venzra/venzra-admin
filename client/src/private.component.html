<mat-toolbar color="primary" role="heading">
    <div fxLayout="column"><img src="http://cdn.venzra.io/logo/white/venzra-logo-xs.png" title="Welcome to Venzra"></div>
    <span fxFlex></span>
    <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="center center">
        <span class="mat-body-1">{{ account.identity }}</span>
        <mat-icon>verified_user</mat-icon>
    </div>
</mat-toolbar>

<div fxLayout="row" fxFlex>
    <mat-sidenav-container>
        <mat-sidenav mode="side" opened="true">
            <mat-nav-list dense>
                <h3 matSubheader>Construct</h3>
                <a mat-list-item routerLink="/account" routerLinkActive="active">Setup</a>

                <mat-divider></mat-divider>

                <h3 matSubheader>Compose</h3>
                <a mat-list-item routerLink="/products" routerLinkActive="active">Products</a>

                <mat-divider></mat-divider>

                <h3 matSubheader>Customer</h3>

                <mat-divider></mat-divider>

                <h3 matSubheader>Control</h3>

                <mat-divider></mat-divider>

                <a mat-list-item routerLink="/auth/logout">Logout</a>
            </mat-nav-list>
        </mat-sidenav>

        <div class="private-content">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-container>
</div>
