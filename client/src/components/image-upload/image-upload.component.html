<div fxLayout="column" fxLayoutGap="10px">
    <div class="mat-subheading-2" fxLayout="row" fxLayoutGap="4px">
        <span>{{ control.placeholder }}</span>
        <span *ngIf="control.required">*</span>
    </div>

    <ng-content></ng-content>

    <div [ngSwitch]="state" class="image-input" [class.invalid]="control.hasError() && touched">
        <div *ngSwitchCase="'info' || 'error'" class="message" fxLayout="column" fxFlex>
            <div fxLayout="column" fxLayoutAlign="center center" fxFlex="grow">
                <mat-icon [ngClass]="{ 'required': control.required && touched }">perm_media</mat-icon>
                <p>Drag and drop a file</p>
            </div>
            <span class="mat-caption" fxLayout="column" fxLayoutAlign="center center">
                <p *ngFor="let requirement of formatRequirements()">{{ requirement }}</p>
            </span>
        </div>

        <div *ngSwitchCase="'success'" class="message" fxLayout="column" fxLayoutAlign="center center" fxFlex>
            <ng-container *ngIf="image">
                <div class="image">
                    <div class="background" [style.background-image]="background"></div>
                    <div class="foreground" fxLayout="row" fxLayoutAlign="center center">
                        <img [src]="image" />
                    </div>
                </div>
            </ng-container>

            <ng-container *ngIf="!image">
                <mat-icon class="required">cloud_upload</mat-icon>
                <p *ngIf="mode === 'determinate'">Uploading to server</p>
                <p *ngIf="mode === 'buffer'">Processing file</p>
                <mat-progress-bar [mode]="mode" [value]="progress" color="accent"></mat-progress-bar>
            </ng-container>
        </div>

        <div *ngSwitchCase="'error'" class="message">
            <div fxLayout="column" fxLayoutAlign="center center">
                <mat-icon class="required">close</mat-icon>
                <strong>{{ detail }}</strong>
                <span class="mat-caption">Please try again</span>
            </div>
        </div>
    </div>
    <label class="mat-caption">or <span>click here</span> to browse for a file</label>
</div>
