<mat-toolbar>
    <mat-toolbar-row fxLayout="row" fxLayoutAlign="space-between start">
        <span class="mat-headline">Shipping options</span>
        <button mat-button color="primary" routerLink="/shipping/create">
            <mat-icon>add_circle</mat-icon> Create New
        </button>
    </mat-toolbar-row>

    <mat-toolbar-row>
        <span fxFlex></span>
        <button mat-icon-button matTooltip="Refresh data" (click)="refresh()"><mat-icon>refresh</mat-icon></button>
    </mat-toolbar-row>
</mat-toolbar>

<div class="list-container mat-elevation-z2">
    <div class="list-loading" *ngIf="loading">
        <mat-spinner color="accent"></mat-spinner>
    </div>

    <mat-table #table [dataSource]="dataSource" matSort matSortDisableClear matSortActive="currentPrice" matSortDirection="asc">
        <ng-container matColumnDef="displayName">
            <mat-header-cell class="column-double" *matHeaderCellDef>Name</mat-header-cell>
            <mat-cell class="column-double" *matCellDef="let row">{{ row.displayName }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="currentPrice">
            <mat-header-cell *matHeaderCellDef mat-sort-header>Price</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.currentPrice | price }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="cartMinimum">
            <mat-header-cell *matHeaderCellDef>Min cart</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.cartMinimum | price | none }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="cartMaximum">
            <mat-header-cell *matHeaderCellDef>Max cart</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.cartMaximum | price | none }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="shipmentTime">
            <mat-header-cell *matHeaderCellDef>Target</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.shipmentTime | shipping }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="created">
            <mat-header-cell *matHeaderCellDef>Created</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.created | date }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="remove">
            <mat-header-cell *matHeaderCellDef></mat-header-cell>
            <mat-cell *matCellDef="let row"><button mat-icon-button (click)="remove(row)"><mat-icon>delete</mat-icon></button></mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="availableColumns"></mat-header-row>
        <mat-row class="table-row" *matRowDef="let row; columns: availableColumns"></mat-row>
    </mat-table>

    <mat-card class="mat-elevation-z0" *ngIf="!shipping.total">
        <mat-card-content>
            <p class="mat-subheading-2">No shipping options available</p>
        </mat-card-content>
    </mat-card>

    <mat-paginator [length]="shipping.total"
                   [pageIndex]="shipping.skip / shipping.limit"
                   [pageSize]="shipping.limit"
                   [pageSizeOptions]="[10,20,50,100]">
    </mat-paginator>
</div>
