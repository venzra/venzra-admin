<mat-toolbar>
    <mat-toolbar-row>
        <span class="mat-headline">Orders placed</span>
    </mat-toolbar-row>

    <mat-toolbar-row>
        <form class="mat-body-1" fxLayout="row" fxLayoutGap="20px" [formGroup]="searchForm">
            <mat-form-field floatPlaceholder="never">
                <input matInput
                       autocomplete="off"
                       placeholder="Search orders"
                       formControlName="searchQuery"
                />
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </form>
        <span fxFlex></span>
        <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Filter by status"><mat-icon>filter_list</mat-icon></button>
    </mat-toolbar-row>
</mat-toolbar>

<mat-menu #menu xPosition="before">
    <button mat-menu-item (click)="status = null">
        <mat-icon>{{ status === null ? 'check' : '' }}</mat-icon>
        <span>Show All</span>
    </button>
    <button mat-menu-item (click)="status = 'CREATED'">
        <mat-icon>{{ status === 'CREATED' ? 'check' : '' }}</mat-icon>
        <span>Created</span>
    </button>
    <button mat-menu-item (click)="status = 'AUTHORISED'">
        <mat-icon>{{ status === 'AUTHORISED' ? 'check' : '' }}</mat-icon>
        <span>Authorised</span>
    </button>
    <button mat-menu-item (click)="status = 'PROCESSING'">
        <mat-icon>{{ status === 'PROCESSING' ? 'check' : '' }}</mat-icon>
        <span>Processing</span>
    </button>
    <button mat-menu-item (click)="status = 'DISPATCHED'">
        <mat-icon>{{ status === 'DISPATCHED' ? 'check' : '' }}</mat-icon>
        <span>Dispatched</span>
    </button>
    <button mat-menu-item (click)="status = 'DELIVERED'">
        <mat-icon>{{ status === 'DELIVERED' ? 'check' : '' }}</mat-icon>
        <span>Delivered</span>
    </button>
</mat-menu>

<div class="mat-elevation-z2">
    <mat-table #table [dataSource]="dataSource" matSort matSortDisableClear matSortActive="created" matSortDirection="desc">
        <ng-container matColumnDef="reference">
            <mat-header-cell *matHeaderCellDef>Ref #</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.reference }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="identity">
            <mat-header-cell class="column-double" *matHeaderCellDef>Customer</mat-header-cell>
            <mat-cell class="column-double" *matCellDef="let row">{{ row.customer.identity }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="destination">
            <mat-header-cell *matHeaderCellDef>Destination</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.destination.postalCode }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="value">
            <mat-header-cell *matHeaderCellDef>Value</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.payment.value | price }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="status">
            <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.status }}</mat-cell>
        </ng-container>
        <ng-container matColumnDef="created">
            <mat-header-cell *matHeaderCellDef mat-sort-header>Created</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.created | date }}</mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="availableColumns"></mat-header-row>
        <mat-row class="table-row" *matRowDef="let row; columns: availableColumns" (click)="navigateTo(row)"></mat-row>
    </mat-table>

    <mat-paginator [length]="orders.total"
                   [pageIndex]="orders.skip / orders.limit"
                   [pageSize]="orders.limit"
                   [pageSizeOptions]="[10,20,50,100]">
    </mat-paginator>
</div>
