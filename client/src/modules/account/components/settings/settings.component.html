<mat-toolbar>
    <span class="mat-headline">Account Setup</span>
</mat-toolbar>

<mat-card>
    <section>
        <h2>Store settings</h2>
        <p>Specify details about your store, set logo, name, domain and template options here.</p>

        <form fxLayout="column" fxLayoutGap="20px" (ngSubmit)="updateSettings()" [formGroup]="settingsForm">
            <mat-form-field>
                <input matInput
                       placeholder="Store name"
                       formControlName="storeName"
                       required="required"
                       #storeName
                />

                <mat-icon matSuffix *ngIf="settingsForm.controls['storeName'].touched && settingsForm.controls['storeName'].valid" color="primary">check_circle</mat-icon>
                <mat-icon matSuffix *ngIf="settingsForm.controls['storeName'].touched && settingsForm.controls['storeName'].invalid" color="warn">error</mat-icon>

                <mat-hint *ngIf="settingsForm.controls['storeName'].valid" align="start"><strong>{{ getDomain() }}</strong></mat-hint>

                <mat-error *ngIf="settingsForm.controls['storeName'].hasError('required')">This field is required.</mat-error>
                <mat-error *ngIf="settingsForm.controls['storeName'].hasError('minlength')">Store name is too short.</mat-error>
            </mat-form-field>

            <mat-form-field>
                <input matInput
                       placeholder="Strapline"
                       formControlName="strapline"
                />
            </mat-form-field>

            <div fxLayoutAlign="end">
                <button mat-raised-button color="primary" type="submit" [disabled]="settingsForm.pristine || settingsForm.invalid">Save changes</button>
            </div>
        </form>
    </section>
</mat-card>

<account-subscription></account-subscription>

<payment-gateway></payment-gateway>
