<mat-toolbar>
    <span class="mat-headline">Manage payments</span>
</mat-toolbar>

<mat-card>
    <div fxLayout="row">
        <h2>Notice</h2>
        <span fxFlex></span>
        <mat-icon color="accent" *ngIf="subscription.status !== 'ACTIVE'">info</mat-icon>
    </div>
    <p>Your account is currently in <strong>{{ subscription.status }}</strong> status.</p>

    <p>Note that you must have an active account to ensure your store is available to customers. To activate your account please setup a payment gateway using the forms below.</p>
</mat-card>

<account-subscription *ngIf="subscription.status === 'ACTIVE'"></account-subscription>

<payment-gateway></payment-gateway>
